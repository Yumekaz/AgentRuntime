[package]
name = "agentrt"
version = "0.1.0"
edition = "2024"
description = "A durable, sandboxed, auditable runtime for multi-step LLM work"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yumekaz/AgentRuntime"
keywords = ["agents", "llm", "runtime", "durability", "audit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.9"

[[bin]]
name = "agentrt"
path = "src/main.rs"
