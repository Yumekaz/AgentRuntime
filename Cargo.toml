[package]
name = "agentrt"
version = "0.1.0"
edition = "2024"
description = "A durable, sandboxed, auditable runtime for multi-step LLM work"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yumekaz/AgentRuntime"
keywords = ["agents", "llm", "runtime", "durability", "audit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[[bin]]
name = "agentrt"
path = "src/main.rs"
